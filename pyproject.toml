[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boiler-app"
version = "0.1.0"
description = "CLI para monitorar temperatura de boilers eWeLink"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "ewelink>=0.2",
    "rich>=13",
    "python-dotenv>=1",
]

[project.scripts]
boiler = "boiler_app.__main__:main"

[tool.setuptools.packages.find]
include = ["boiler_app*"]
